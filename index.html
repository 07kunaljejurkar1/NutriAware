<!-- PERSONAL NUTRITION PLAN -->
<section id="personalNutritionPlan">
  <h2>🥗 Personal Nutrition Plan</h2>
  <p>Enter your details to generate your personalised nutrition plan.</p>

  <form id="nutritionForm">
    <label>Age:</label>
    <input type="number" id="age" min="1" max="120" required
           placeholder="Enter your age">

    <label>Weight (kg):</label>
    <input type="number" id="weight" min="1" max="350" step="0.1"
           required placeholder="Enter your weight">

    <label>Height (cm):</label>
    <input type="number" id="height" min="30" max="250" step="0.1"
           required placeholder="Enter your height">

    <label>Food Allergies:</label>
    <input type="text" id="allergies" required
           placeholder="Example: peanuts, milk, eggs, or None">

    <label>Food Preference:</label>
    <select id="diet">
      <option value="vegetarian">Vegetarian</option>
      <option value="vegan">Vegan</option>
      <option value="nonvegetarian">Non-vegetarian</option>
    </select>

    <label>Favourite Foods:</label>
    <input type="text" id="likes"
           placeholder="Example: poha, rice, dal">

    <label>Foods You Dislike:</label>
    <input type="text" id="dislikes"
           placeholder="Example: mushrooms, bitter gourd">

    <label>Ingredients or Crops to Avoid:</label>
    <input type="text" id="crops"
           placeholder="Example: groundnuts, soybeans, wheat">

    <label>Nutrition Goal:</label>
    <select id="goal">
      <option value="balanced">Balanced Nutrition</option>
      <option value="muscle">Muscle Gain Support</option>
      <option value="weight">Weight Management</option>
    </select>

    <button type="submit">Generate My Nutrition Plan</button>
  </form>

  <div id="nutritionResult" aria-live="polite"></div>
</section>

<style>
#personalNutritionPlan {
  max-width: 750px;
  margin: 20px auto;
  padding: 20px;
  background: #ffffff;
  border-radius: 15px;
  box-shadow: 0 4px 15px #00000015;
  font-family: Arial, sans-serif;
}

#personalNutritionPlan h2 {
  color: #16834a;
}

#personalNutritionPlan label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

#personalNutritionPlan input,
#personalNutritionPlan select {
  box-sizing: border-box;
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #cccccc;
  border-radius: 8px;
}

#personalNutritionPlan button {
  margin-top: 20px;
  padding: 12px 18px;
  background: #16834a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#nutritionResult .meal {
  background: #f0faf3;
  padding: 12px;
  margin-top: 12px;
  border-left: 4px solid #16834a;
  border-radius: 6px;
}

#nutritionResult .warning {
  background: #fff5d9;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
}
</style>

<script>
document.getElementById("nutritionForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const age = Number(document.getElementById("age").value);
  const weight = Number(document.getElementById("weight").value);
  const height = Number(document.getElementById("height").value);
  const allergies = document.getElementById("allergies").value
    .toLowerCase().split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  const diet = document.getElementById("diet").value;
  const likes = document.getElementById("likes").value;
  const dislikes = document.getElementById("dislikes").value;
  const crops = document.getElementById("crops").value;
  const goal = document.getElementById("goal").value;

  if (age < 1 || age > 120 || weight <= 0 ||
      weight > 350 || height < 30 || height > 250) {
    document.getElementById("nutritionResult").innerHTML =
      "<p>Please enter valid age, weight, and height.</p>";
    return;
  }

  const restrictions = [...allergies, dislikes, crops]
    .filter(x => x && x !== "none" && x !== "no allergies")
    .join(" ");

  const meals = [
    {
      name: "Vegetable Poha",
      diet: ["vegetarian", "vegan"],
      ingredients: "rice flakes, onion, potato, vegetables, peanuts"
    },
    {
      name: "Oats with Banana",
      diet: ["vegetarian", "vegan"],
      ingredients: "oats, banana, milk"
    },
    {
      name: "Idli and Sambar",
      diet: ["vegetarian", "vegan"],
      ingredients: "rice, urad dal, lentils, vegetables"
    },
    {
      name: "Roti, Dal and Vegetables",
      diet: ["vegetarian", "vegan"],
      ingredients: "wheat, atta, lentils, vegetables"
    },
    {
      name: "Rice and Rajma",
      diet: ["vegetarian", "vegan"],
      ingredients: "rice, kidney beans, tomato"
    },
    {
      name: "Paneer with Roti",
      diet: ["vegetarian"],
      ingredients: "paneer, milk, wheat, tomato"
    },
    {
      name: "Tofu and Vegetable Rice",
      diet: ["vegetarian", "vegan"],
      ingredients: "tofu, soybeans, rice, vegetables"
    },
    {
      name: "Boiled Eggs and Rice",
      diet: ["nonvegetarian"],
      ingredients: "eggs, rice, vegetables"
    },
    {
      name: "Chicken with Rice",
      diet: ["nonvegetarian"],
      ingredients: "chicken, rice, vegetables"
    },
    {
      name: "Fruit Bowl",
      diet: ["vegetarian", "vegan", "nonvegetarian"],
      ingredients: "apple, banana, papaya, orange"
    }
  ];

  // Basic ingredient matching only; it cannot guarantee allergy safety.
  const aliases = {
    peanuts: ["peanut", "groundnut", "moongphali"],
    milk: ["milk", "dairy", "paneer", "cheese", "curd", "yogurt"],
    eggs: ["egg"],
    wheat: ["wheat", "atta", "maida"],
    soybeans: ["soy", "soya", "tofu"],
    rice: ["rice", "poha"],
    nuts: ["almond", "cashew", "walnut"]
  };

  const blockedTerms = [];

  Object.entries(aliases).forEach(([key, words]) => {
    const userMentioned = words.some(word =>
      restrictions.includes(word)
    );

    if (userMentioned) {
      blockedTerms.push(...words);
    }
  });

  const safeSuggestions = meals.filter(meal => {
    if (!meal.diet.includes(diet)) return false;

    const ingredients = meal.ingredients.toLowerCase();

    return !blockedTerms.some(term => ingredients.includes(term));
  });

  // Avoid foods the user dislikes when the ingredient is identifiable.
  const dislikedTerms = dislikes.toLowerCase()
    .split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);

  const cropTerms = crops.toLowerCase()
    .split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);

  const filteredMeals = safeSuggestions.filter(meal => {
    const ingredients = meal.ingredients.toLowerCase();

    return ![...dislikedTerms, ...cropTerms].some(term =>
      term && ingredients.includes(term)
    );
  });

  const selectedMeals = filteredMeals.length
    ? filteredMeals
    : [];

  const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);

  let proteinText;

  if (age < 18) {
    proteinText =
      "Your protein needs depend on growth and development. Ask a qualified healthcare professional for an age-appropriate target.";
  } else {
    let protein = Math.round(weight * 0.8);

    if (goal === "muscle") {
      protein = Math.round(weight * 1.2);
    }

    proteinText = "Rough adult protein reference: approximately " +
      protein + " g/day. Individual needs vary.";
  }

  let mealHTML = "";

  if (selectedMeals.length) {
    mealHTML = selectedMeals.map((meal, index) => `
      <div class="meal">
        <strong>${escapeHTML(meal.name)}</strong>
        <p>Ingredients: ${escapeHTML(meal.ingredients)}</p>
      </div>
    `).join("");
  } else {
    mealHTML = `
      <div class="meal">
        No matching meals were found for these preferences.
        Try reviewing your restrictions and consult a nutrition professional.
      </div>
    `;
  }

  const goalText = {
    balanced: "Balanced Nutrition",
    muscle: "Muscle Gain Support",
    weight: "Weight Management"
  }[goal];

  document.getElementById("nutritionResult").innerHTML = `
    <h2>🌱 Your Personal Nutrition Plan</h2>

    <p><strong>Age:</strong> ${age} years</p>
    <p><strong>Weight:</strong> ${weight} kg</p>
    <p><strong>Height:</strong> ${height} cm</p>
    <p><strong>Goal:</strong> ${goalText}</p>

    <h3>💪 Protein Guidance</h3>
    <p>${escapeHTML(proteinText)}</p>

    <h3>🍽️ Suggested Foods</h3>
    ${mealHTML}

    <h3>🥦 Daily Nutrition Tips</h3>
    <ul>
      <li>Eat a variety of vegetables and fruits.</li>
      <li>Include suitable whole grains and carbohydrate sources.</li>
      <li>Choose protein foods that fit your dietary preference.</li>
      <li>Include fibre-rich foods and drink water regularly.</li>
      <li>Adjust portions to your age, activity, and individual needs.</li>
    </ul>

    <p><strong>Favourite foods:</strong>
      ${escapeHTML(likes || "Not specified")}</p>

    <div class="warning">
      <strong>Allergy safety:</strong> This demo uses basic text matching.
      It may miss hidden ingredients, alternate names, or cross-contact.
      Always check food labels and preparation details. Do not rely on
      this tool alone to determine whether food is safe for an allergy.
    </div>

    <p><small>
      This is an educational demo, not a medical prescription.
      Protein estimates are rough references and may not suit everyone.
    </small></p>
  `;

  // Save the user's inputs in this browser.
  try {
    localStorage.setItem("nutriaware_personal_plan", JSON.stringify({
      age, weight, height, allergies, diet, likes, dislikes, crops, goal
    }));
  } catch (error) {
    console.warn("Could not save the nutrition form locally.");
  }
});
</script>
